<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Books List - Admin</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../Navbar/Navbar.css">
    <link rel="stylesheet" type="text/css" href="EditAndDelete.css">
    <link rel="stylesheet" type="text/css" href="BooksListAdminStyle.css">
</head>
<body>
    <nav class="navbar">
        <a href="../register pages/welcomeAdmin.html" class="logo">Book Hub</a>
        <ul class="nav-links">
            <li><a href="../register pages/welcomeAdmin.html">Home</a></li>
            <hr class="hr">
            <li><a href="../Book details/Admin Books list.html">Book List</a></li>
            <hr class="hr">
            <li><a href="../Search and Details/Admin Search.html">Search</a></li>
            <hr class="hr">
            <li><a href="../Book details/Adding new  Book.html">Adding new book</a></li>
            <hr class="hr">
            <li><a id="logoutb" href="../register pages/login.html">Logout</a></li>
        </ul>
        <button class="material-symbols-outlined" onclick="toggleDarkMode()">dark_mode</button>
        <div class="menu-toggle">&#9776;</div>
    </nav>

    <div class="container">
        <section class="category-group">
            <h2 class="section-title">✨ Newly Added</h2>
            <div class="books-container" id="newly-added"></div>
        </section>

        <section class="category-group">
            <h2 class="section-title">📈 Trending</h2>
            <div class="books-container" id="trending"></div>
        </section>

        <section class="category-group">
            <h2 class="section-title">💻 Programming & Tech</h2>
            <div class="books-container" id="programming"></div>
        </section>

        <section class="category-group">
            <h2 class="section-title">🍳 Cooking & Food</h2>
            <div class="books-container" id="cooking"></div>
        </section>

        <section class="category-group">
            <h2 class="section-title">🏛️ History & Culture</h2>
            <div class="books-container" id="history"></div>
        </section>

        <section class="category-group">
            <h2 class="section-title">📖 Fiction & Novels</h2>
            <div class="books-container" id="fiction"></div>
        </section>
    </div>

    <div id="overlay" class="overlay" style="display:none;">
        <div class="card" id="confirmBox">
            <h2>Delete Book</h2>
            <p>Do you really want to delete this book?</p>
            <button class="delete" onclick="confirmDelete()">Yes</button>
            <button class="cancel" onclick="closePopup()">Cancel</button>
        </div>
        <div class="card" id="successBox" style="display:none;">
            <h2>Success</h2>
            <p>Book deleted successfully</p>
            <button class="save" onclick="closePopup()" style="width: 50%">OK</button>
        </div>
    </div>

    <script src="../Navbar/Navbar.js"></script>
    <script src="adminBookList.js"></script>
    <script src="EditAndDelete.js"></script>
</body>
</html>
